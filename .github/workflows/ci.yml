name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # build before typecheck: workspace packages resolve each other's
      # declaration files from dist/
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # DCO: every commit from a non-team contributor must carry a Signed-off-by
  # trailer (git commit --signoff). This preserves licensing optionality and
  # costs contributors one flag. Team accounts are exempt.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on all PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Comma-separated GitHub usernames exempt from DCO (team members).
          TEAM: meyerdav24
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case ",${TEAM}," in
            *",${AUTHOR},"*)
              echo "Author ${AUTHOR} is a team member; DCO check skipped."
              exit 0
              ;;
          esac
          missing=0
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .*<.*@.*>'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer. Amend with: git commit --amend --signoff"
              missing=1
            fi
          done
          exit $missing
